[package]
name = "demucs-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "demucs-gui"
path = "src/main.rs"

[features]
default = []
cpu  = ["demucs-core/ndarray", "burn/ndarray"]
cuda = ["demucs-core/cuda", "burn/cuda"]

[dependencies]
demucs-core = { path = "../demucs-core", features = ["wgpu", "autotune", "fusion"] }
burn = { version = "0.20.1", features = ["wgpu", "autotune", "fusion"] }
cubecl = { version = "0.9", default-features = false }
eframe = "0.33"
egui = "0.33"
egui-file-dialog = "0.12"
hound = "3"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "pcm", "aac", "isomp4", "aiff"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
anyhow = "1"
pollster = "0.4"
rodio = { version = "0.20", default-features = false, features = ["wav"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.20.1", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.20.1", features = ["vulkan"] }
